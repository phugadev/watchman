name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # No WATCHMAN_SECRET here on purpose: a build must not require runtime
      # configuration. This step is what would catch a regression to eager
      # resolution of the secret.
      - run: pnpm build

      # A build must not touch the database either. If it does, some page that depends
      # on live state is being prerendered — and at build time the database is empty, so
      # auth checks take their needs-setup branch and Next bakes that redirect in
      # permanently. Cheap assertion, nasty bug.
      - name: Assert the build stayed database-free
        run: |
          if [ -e data ]; then
            echo "::error::pnpm build created $(ls data) — a route depending on live DB state is being prerendered. Add 'export const dynamic = \"force-dynamic\"' to it."
            exit 1
          fi
          echo "build did not touch the database"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
